name: Build Proot for aarch64

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        SECCOMP: [0, 1]

    steps:
      - uses: actions/checkout@v4

      - name: Build in Docker
        env:
          SECCOMP: ${{ matrix.SECCOMP }}
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            -e SECCOMP=$SECCOMP \
            arm64v8/ubuntu:22.04 \
            /bin/bash -c "
              apt-get update -y
              apt-get install -y \
                gcc \
                g++ \
                make \
                libarchive-dev \
                libtalloc-dev \
                uthash-dev \
                binutils \
                file

              # 编译
              if [ \$SECCOMP -eq 0 ]; then
                export PROOT_NO_SECCOMP=1
              fi

              make -C src proot care

              # 检查架构
              file src/proot
            "

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: proot-aarch64-${{ matrix.SECCOMP == '1' && 'seccomp' || 'no-seccomp' }}
          path: |
            src/proot
            src/care