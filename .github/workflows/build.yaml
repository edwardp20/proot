name: Build Proot for aarch64 (Static)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        SECCOMP: [0, 1]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static proot in Alpine
        env:
          SECCOMP: ${{ matrix.SECCOMP }}
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v $PWD:/workspace \
            -w /workspace \
            -e SECCOMP=$SECCOMP \
            arm64v8/alpine:3.19 \
            /bin/sh -c "
              set -eux

              # 安装编译依赖
              apk add --no-cache \
                gcc \
                g++ \
                make \
                musl-dev \
                talloc-dev \
                libarchive-dev \
                uthash-dev \
                binutils \
                file \
                linux-headers
              apk add bsd-compat-headers
              apk add --no-cache \
              libseccomp-dev \
              libseccomp-static \
              build-base

              # 禁用 seccomp（如果 SECCOMP=0）
              if [ \$SECCOMP -eq 0 ]; then
                export PROOT_NO_SECCOMP=1
              fi

              # 静态编译
              make -C src proot care \
                LDFLAGS='-static'

              # 验证静态链接
              file src/proot | grep 'statically linked'
              ls -la src/proot src/care
            "

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: proot-aarch64-${{ matrix.SECCOMP == '1' && 'seccomp' || 'no-seccomp' }}
          path: |
            src/proot
            src/care